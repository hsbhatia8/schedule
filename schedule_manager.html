};

let ideaDragState=null; // {id, key}

function clearIdeaDropClasses(){
  document.querySelectorAll('.idea-item.drop-before,.idea-item.drop-after').forEach(el=>el.classList.remove('drop-before','drop-after'));
}

function renderIdeas(){
  ['beacon','ukb','cohort','iproj-active','iproj-completed'].forEach(key=>{
    const list=document.getElementById('ilist-'+key);if(!list)return;
    list.innerHTML='';
    const items=state.ideas[key]||[];
    items.forEach(item=>list.appendChild(createIdeaEl(item,key)));

    // Apply section color + icon + count
    const cfg=IDEA_SECTIONS[key]||{};
    const sec=document.getElementById('isec-'+key);
    if(sec&&cfg.color)sec.style.borderTopColor=cfg.color;

    const iconEl=document.getElementById('isec-icon-'+key);
    if(iconEl&&cfg.icon){iconEl.innerHTML=cfg.icon;iconEl.style.color=cfg.color;}

    const countEl=document.getElementById('isec-count-'+key);
    if(countEl)countEl.textContent=items.length;
  });
}

function createIdeaEl(item,key){
  const cfg=IDEA_SECTIONS[key]||{};
  const div=document.createElement('div');
  div.className='idea-item';div.draggable=true;div.dataset.id=item.id;
  if(cfg.color)div.style.borderLeftColor=cfg.color;

  div.addEventListener('dragstart',e=>{
    ideaDragState={id:item.id,key};
    e.dataTransfer.setData('text/plain',JSON.stringify({id:item.id,key}));
    e.dataTransfer.effectAllowed='move';
    requestAnimationFrame(()=>div.classList.add('idea-dragging'));
  });
  div.addEventListener('dragend',()=>{
    ideaDragState=null;
    div.classList.remove('idea-dragging');
    clearIdeaDropClasses();
  });
  div.addEventListener('dragover',e=>{
    if(!ideaDragState)return;
    e.preventDefault();e.stopPropagation();
    clearIdeaDropClasses();
    const rect=div.getBoundingClientRect();
    div.classList.add(e.clientY<rect.top+rect.height/2?'drop-before':'drop-after');
  });
  div.addEventListener('dragleave',()=>div.classList.remove('drop-before','drop-after'));
  div.addEventListener('drop',e=>{
    e.preventDefault();e.stopPropagation();
    if(!ideaDragState||ideaDragState.id===item.id){clearIdeaDropClasses();return;}
    const insertAfter=div.classList.contains('drop-after');
    clearIdeaDropClasses();
    const {id:dragId,key:srcKey}=ideaDragState;
    const draggedItem=(state.ideas[srcKey]||[]).find(i=>i.id===dragId);if(!draggedItem)return;
    state.ideas[srcKey]=(state.ideas[srcKey]||[]).filter(i=>i.id!==dragId);
    const dest=state.ideas[key]||[];
    const ti=dest.findIndex(i=>i.id===item.id);
    dest.splice(ti===-1?dest.length:(insertAfter?ti+1:ti),0,draggedItem);
    state.ideas[key]=dest;
    saveState();renderIdeas();
  });

  const span=document.createElement('span');span.textContent=item.text;span.style.flex='1';
  div.appendChild(span);
  const del=document.createElement('button');del.className='idea-del';del.textContent='✕';
  del.addEventListener('click',()=>{state.ideas[key]=state.ideas[key].filter(i=>i.id!==item.id);saveState();renderIdeas();});
  div.appendChild(del);
  return div;
}

function ideaDragOver(e,key){e.preventDefault();document.getElementById('ilist-'+key).classList.add('drag-over');}
function ideaDragLeave(e,key){document.getElementById('ilist-'+key).classList.remove('drag-over');}
function ideaDrop(e,key){
  // List-level drop: only fires if not stopped by an item drop — appends to end
  e.preventDefault();
  document.getElementById('ilist-'+key).classList.remove('drag-over');
  clearIdeaDropClasses();
  try{
    const data=JSON.parse(e.dataTransfer.getData('text/plain'));
    const item=(state.ideas[data.key]||[]).find(i=>i.id===data.id);if(!item)return;
    state.ideas[data.key]=(state.ideas[data.key]||[]).filter(i=>i.id!==data.id);
    if(!state.ideas[key])state.ideas[key]=[];
    state.ideas[key].push(item);
    saveState();renderIdeas();
  }catch(err){}
}

// SVG paths for each stage icon
const STAGE_ICONS={
  'Medical Student':{cls:'si-ms',svg:`<svg viewBox="0 0 24 24"><polygon points="12 3 22 8.5 12 14 2 8.5"/><polyline points="7 11 7 16.5 12 19.5 17 16.5 17 11"/><line x1="12" y1="14" x2="12" y2="19.5"/></svg>`},
  'Resident':      {cls:'si-res',svg:`<svg viewBox="0 0 24 24"><path d="M4.5 6a1.5 1.5 0 0 1 3 0v5a4.5 4.5 0 0 0 9 0V6a1.5 1.5 0 0 1 3 0"/><path d="M12 15.5v2"/><path d="M9 20h6"/><circle cx="12" cy="21" r="1" fill="currentColor" stroke="none"/></svg>`},
  'Fellow':        {cls:'si-fel',svg:`<svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="5"/><path d="M15.5 13.5 17 22l-5-3-5 3 1.5-8.5"/><line x1="9" y1="8" x2="15" y2="8"/><line x1="12" y1="5" x2="12" y2="11"/></svg>`},
};
function stageIconHTML(stage){
  const def=STAGE_ICONS[stage]||{cls:'si-oth',svg:`<svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/></svg>`};
  return`<span class="stage-icon ${def.cls}" title="${stage}">${def.svg}</span>`;
}

function setMenteeLayout(layout){
  state.menteeLayout=layout;
  saveState();
  ['cards','compact','kanban'].forEach(l=>{
    const btn=document.getElementById('mlb-'+l);
    if(btn)btn.classList.toggle('active',l===layout);
  });
  renderMentees();
}

function addMentee(){
  const name=(document.getElementById('mentee-name-inp').value||'').trim();
  const stage=document.getElementById('mentee-stage-sel').value;
  if(!name)return;
  state.mentees.push({id:uid(),name,stage,projects:[]});
  document.getElementById('mentee-name-inp').value='';
  saveState();renderMentees();
}

let _menteeDragId=null;
let _projDragState=null; // {projId, menteeId}

function _clearMenteeDropClasses(){
  document.querySelectorAll('.mentee-card.drop-before,.mentee-card.drop-after').forEach(el=>el.classList.remove('drop-before','drop-after'));
}
function _clearProjDropClasses(projs){
  projs.querySelectorAll('.mentee-proj.drop-before,.mentee-proj.drop-after').forEach(el=>el.classList.remove('drop-before','drop-after'));
}

function renderMentees(){
  const list=document.getElementById('mentees-list');if(!list)return;
  list.innerHTML='';
  const layout=state.menteeLayout||'cards';
  list.className=`layout-${layout}`;

  // Sync layout button active state
  ['cards','compact','kanban'].forEach(l=>{
    const btn=document.getElementById('mlb-'+l);
    if(btn)btn.classList.toggle('active',l===layout);
  });

  const statusOrder={Active:0,'On Hold':1,Completed:2,Other:3};

  if(layout==='kanban'){
    const STAGES=['Medical Student','Resident','Fellow'];
    const groups={};STAGES.forEach(s=>groups[s]=[]);
    const others=[];
    state.mentees.forEach(m=>{if(groups[m.stage])groups[m.stage].push(m);else others.push(m);});
    if(others.length)groups['Other']=others;
    const stagesToShow=[...STAGES,...(others.length?['Other']:[])];

    stagesToShow.forEach(stage=>{
      const members=groups[stage]||[];
      const col=document.createElement('div');col.className='mk-col';
      const hdr=document.createElement('div');hdr.className='mk-col-header';
      hdr.innerHTML=`${stageIconHTML(stage)}<span class="mk-col-title">${stage}s</span><span class="mk-col-count">${members.length}</span>`;
      col.appendChild(hdr);
      const body=document.createElement('div');body.className='mk-col-body';
      members.forEach(m=>{body.appendChild(_buildMenteeCard(m,statusOrder,'kanban'));});
      col.appendChild(body);
      list.appendChild(col);
    });
    return; // kanban renders inside columns, skip the list-level drag setup below
  }

  state.mentees.forEach(m=>{
    list.appendChild(_buildMenteeCard(m,statusOrder));
  });

  // List-level mentee drag-reorder (cards + compact; property assignment avoids stacking on re-render)
  list.ondragover=e=>{
    if(!_menteeDragId)return;e.preventDefault();
    const target=e.target.closest('.mentee-card');if(!target||target.dataset.id===_menteeDragId)return;
    _clearMenteeDropClasses();
    const rect=target.getBoundingClientRect();
    target.classList.add(e.clientY<rect.top+rect.height/2?'drop-before':'drop-after');
  };
  list.ondragleave=e=>{if(!list.contains(e.relatedTarget))_clearMenteeDropClasses();};
  list.ondrop=e=>{
    if(!_menteeDragId)return;
    const target=e.target.closest('.mentee-card');if(!target||target.dataset.id===_menteeDragId)return;
    e.preventDefault();
    const insertAfter=target.classList.contains('drop-after');
    _clearMenteeDropClasses();
    const fromIdx=state.mentees.findIndex(x=>x.id===_menteeDragId);if(fromIdx===-1)return;
    const[item]=state.mentees.splice(fromIdx,1);
    const toIdx=state.mentees.findIndex(x=>x.id===target.dataset.id);
    state.mentees.splice(insertAfter?toIdx+1:toIdx,0,item);
    saveState();renderMentees();
  };
}

function _buildMenteeCard(m, statusOrder, layout){
    const isKanban=layout==='kanban';
    const card=document.createElement('div');
    card.className='mentee-card';
    card.draggable=!isKanban;
    card.dataset.id=m.id;

    if(!isKanban){
      // ── Mentee card drag (reorder mentees in cards/compact mode) ──
      card.addEventListener('dragstart',e=>{
        if(_projDragState)return;
        _menteeDragId=m.id;
        e.dataTransfer.setData('text/plain',m.id);
        e.dataTransfer.effectAllowed='move';
        requestAnimationFrame(()=>card.classList.add('dragging'));
      });
      card.addEventListener('dragend',()=>{
        _menteeDragId=null;
        card.classList.remove('dragging');
        _clearMenteeDropClasses();
      });
      card.addEventListener('dragover',e=>{
        if(!_menteeDragId||_menteeDragId===m.id)return;
        e.preventDefault();e.stopPropagation();
        const rect=card.getBoundingClientRect();
        _clearMenteeDropClasses();
        card.classList.add(e.clientY<rect.top+rect.height/2?'drop-before':'drop-after');
      });
      card.addEventListener('dragleave',()=>card.classList.remove('drop-before','drop-after'));
      card.addEventListener('drop',e=>{
        card.classList.remove('drop-before','drop-after');
        if(!_menteeDragId||_menteeDragId===m.id)return;
        e.preventDefault();e.stopPropagation();
        const arr=state.mentees;
        const fi=arr.findIndex(x=>x.id===_menteeDragId);if(fi===-1)return;
        const[item]=arr.splice(fi,1);
        const rect=card.getBoundingClientRect();
        const ti=arr.findIndex(x=>x.id===m.id);
        arr.splice(e.clientY>=rect.top+rect.height/2?ti+1:ti,0,item);
        saveState();renderMentees();
      });
    }

    const nameRow=document.createElement('div');nameRow.className='mentee-name';
    nameRow.innerHTML=`${stageIconHTML(m.stage)}<span style="flex:1">${escHtml(m.name)}</span><span class="mentee-stage">${escHtml(m.stage)}</span>`;
    card.appendChild(nameRow);

    // ── Projects (sorted display, drag-reorderable within status groups) ──
    const projs=document.createElement('div');projs.className='mentee-projects';
    const sortedProjs=[...m.projects].sort((a,b)=>(statusOrder[a.status]??3)-(statusOrder[b.status]??3));

    sortedProjs.forEach(p=>{
      const pEl=document.createElement('div');pEl.className='mentee-proj';
      pEl.draggable=true;
      pEl.dataset.id=p.id;

      // ── Project chip drag (reorder projects) ──
      pEl.addEventListener('dragstart',e=>{
        e.stopPropagation(); // don't trigger mentee card drag
        _projDragState={projId:p.id,menteeId:m.id};
        _menteeDragId=null;
        e.dataTransfer.setData('text/plain',p.id);
        e.dataTransfer.effectAllowed='move';
        requestAnimationFrame(()=>pEl.classList.add('dragging'));
      });
      pEl.addEventListener('dragend',()=>{
        _projDragState=null;
        pEl.classList.remove('dragging');
        _clearProjDropClasses(projs);
      });
      pEl.addEventListener('dragover',e=>{
        if(!_projDragState||_projDragState.projId===p.id||_projDragState.menteeId!==m.id)return;
        e.preventDefault();e.stopPropagation();
        const rect=pEl.getBoundingClientRect();
        _clearProjDropClasses(projs);
        pEl.classList.add(e.clientX<rect.left+rect.width/2?'drop-before':'drop-after');
      });
      pEl.addEventListener('dragleave',()=>pEl.classList.remove('drop-before','drop-after'));
      pEl.addEventListener('drop',e=>{
        pEl.classList.remove('drop-before','drop-after');
        if(!_projDragState||_projDragState.projId===p.id||_projDragState.menteeId!==m.id)return;
        e.preventDefault();e.stopPropagation();
        // Reorder within the sorted display order, then write back to m.projects
        const fi=sortedProjs.findIndex(x=>x.id===_projDragState.projId);if(fi===-1)return;
        const[item]=sortedProjs.splice(fi,1);
        const rect=pEl.getBoundingClientRect();
        const ti=sortedProjs.findIndex(x=>x.id===p.id);
        sortedProjs.splice(e.clientX>=rect.left+rect.width/2?ti+1:ti,0,item);
        m.projects=sortedProjs;
        saveState();renderMentees();
      });

      // Row 1: dot + name (clickable) + status dropdown + delete
      const row1=document.createElement('div');row1.className='mentee-proj-row1';
      const statusColors={Active:'#22c55e','On Hold':'#ef4444',Completed:'#6366f1',Other:'#888'};
      const dot=document.createElement('span');dot.className='mentee-proj-status';
      dot.style.background=statusColors[p.status]||'#888';
      row1.appendChild(dot);
      const t=document.createElement('span');t.className='mentee-proj-name';t.textContent=p.name;
      t.addEventListener('click',e=>{e.stopPropagation();openEditMenteeProject(m.id,p.id);});
      row1.appendChild(t);
      const sd=document.createElement('select');
      sd.style.cssText='background:var(--surface3);border:none;color:var(--text2);font-size:11px;padding:1px 3px;border-radius:3px;margin-left:auto;cursor:pointer';
      ['Active','On Hold','Completed','Other'].forEach(s=>{
        const o=document.createElement('option');o.value=s;o.textContent=s;if(p.status===s)o.selected=true;sd.appendChild(o);
      });
      sd.addEventListener('change',e=>{e.stopPropagation();p.status=sd.value;saveState();renderMentees();});
      row1.appendChild(sd);
      const pd=document.createElement('button');pd.textContent='✕';pd.style.cssText='background:none;border:none;color:var(--text3);cursor:pointer;font-size:11px;margin-left:4px';
      pd.addEventListener('click',e=>{e.stopPropagation();m.projects=m.projects.filter(x=>x.id!==p.id);saveState();renderMentees();});
      row1.appendChild(pd);
      pEl.appendChild(row1);

      // Row 2: Abstract / Manuscript tags (only if set)
      const ab=p.abstract||{text:'',tag:''};
      const ms=p.manuscript||{text:'',tag:''};
      if(ab.text||ab.tag||ms.text||ms.tag){
        const meta=document.createElement('div');meta.className='mentee-proj-meta';
        [[ab,'Abstract'],[ms,'Manuscript']].forEach(([item,label])=>{
          if(!item.text&&!item.tag)return;
          const row=document.createElement('div');row.className='proj-tag-row';
          const lbl=document.createElement('span');lbl.className='proj-tag-label';lbl.textContent=label+':';
          row.appendChild(lbl);
          if(item.text){const tx=document.createElement('span');tx.textContent=item.text;row.appendChild(tx);}
          if(item.tag){const tg=document.createElement('span');tg.className='proj-tag '+item.tag;tg.textContent=item.tag.charAt(0).toUpperCase()+item.tag.slice(1);row.appendChild(tg);}
          meta.appendChild(row);
        });
        pEl.appendChild(meta);
      }
      projs.appendChild(pEl);
    });
    card.appendChild(projs);

    const addBtn=document.createElement('button');addBtn.className='btn-secondary';addBtn.textContent='+ Add Project';addBtn.style.cssText='margin-top:8px;font-size:11px;padding:3px 8px';
    addBtn.addEventListener('click',e=>{e.stopPropagation();openAddMenteeProject(m.id);});
    card.appendChild(addBtn);

    const del=document.createElement('button');del.className='mentee-del';del.textContent='✕';
    del.addEventListener('click',e=>{e.stopPropagation();if(confirm('Delete mentee?')){state.mentees=state.mentees.filter(x=>x.id!==m.id);saveState();renderMentees();}});
    card.appendChild(del);

    return card;
}

function openAddMenteeProject(menteeId){
  showModal(_projModalHTML('Add Project',`saveAddMenteeProject('${menteeId}')`,null));
}

function saveAddMenteeProject(menteeId){
  const name=(document.getElementById('mp-name').value||'').trim();if(!name)return;
  const status=document.getElementById('mp-status').value;
  const abstract={text:(document.getElementById('mp-ab-text').value||'').trim(),tag:document.getElementById('mp-ab-tag').value};
  const manuscript={text:(document.getElementById('mp-ms-text').value||'').trim(),tag:document.getElementById('mp-ms-tag').value};
  const m=state.mentees.find(x=>x.id===menteeId);if(!m)return;
  m.projects.push({id:uid(),name,status,abstract,manuscript});
  saveState();closeModal();renderMentees();
}

function openEditMenteeProject(menteeId,projId){
  const m=state.mentees.find(x=>x.id===menteeId);if(!m)return;
  const p=m.projects.find(x=>x.id===projId);if(!p)return;
  showModal(_projModalHTML('Edit Project',`saveEditMenteeProject('${menteeId}','${projId}')`,p));
}

function saveEditMenteeProject(menteeId,projId){
  const name=(document.getElementById('mp-name').value||'').trim();if(!name)return;
  const m=state.mentees.find(x=>x.id===menteeId);if(!m)return;
  const p=m.projects.find(x=>x.id===projId);if(!p)return;
  p.name=name;
  p.status=document.getElementById('mp-status').value;
  p.abstract={text:(document.getElementById('mp-ab-text').value||'').trim(),tag:document.getElementById('mp-ab-tag').value};
  p.manuscript={text:(document.getElementById('mp-ms-text').value||'').trim(),tag:document.getElementById('mp-ms-tag').value};
  saveState();closeModal();renderMentees();
}

function openTheme(){
  const themeKeys=Object.keys(THEMES);
  const themeButtonsHtml=themeKeys.map(k=>{
    const t=THEMES[k];
    const bg=t.vars['--bg'];const surf=t.vars['--surface'];const acc=t.vars['--accent'];const txt=t.vars['--text'];
    return `<div class="theme-btn" style="background:${bg};color:${txt};border-color:${acc}" onclick="applyThemeByKey('${k}')">${t.name}</div>`;
  }).join('');

  showModal(`
  <div class="modal">
    <button class="modal-close" onclick="closeModal()">&#x2715;</button>
    <h3>Choose Theme</h3>
    <p style="font-size:12px;color:var(--text2);margin-bottom:8px">Dark themes</p>
    <div class="theme-grid">${themeKeys.filter(k=>THEMES[k].dark).map(k=>{const t=THEMES[k];return `<div class="theme-btn" style="background:${t.vars['--bg']};color:${t.vars['--text']};border-color:${t.vars['--accent']}" onclick="applyThemeByKey('${k}');closeModal()">${t.name}</div>`;}).join('')}</div>
    <p style="font-size:12px;color:var(--text2);margin:8px 0">Light themes</p>
    <div class="theme-grid">${themeKeys.filter(k=>!THEMES[k].dark).map(k=>{const t=THEMES[k];return `<div class="theme-btn" style="background:${t.vars['--bg']};color:${t.vars['--text']};border-color:${t.vars['--accent']}" onclick="applyThemeByKey('${k}');closeModal()">${t.name}</div>`;}).join('')}</div>
    <p style="font-size:12px;color:var(--text2);margin:8px 0">Custom color</p>
    <div class="custom-theme-row">
      <label style="font-size:12px;color:var(--text2)">Hue:</label>
      <input type="range" id="custom-hue" min="0" max="360" value="220" style="flex:1" oninput="document.getElementById('custom-hue-val').textContent=this.value">
      <span id="custom-hue-val" style="font-size:12px;min-width:28px">220</span>
      <button class="btn-secondary" onclick="applyCustomTheme(parseInt(document.getElementById('custom-hue').value));closeModal()">Apply</button>
    </div>
  </div>`);
}

function applyThemeByKey(key){
  const t=THEMES[key];if(!t)return;
  applyTheme(t);
  state.theme=t;
  saveState();
}

// ============================================================
// INIT
// ============================================================
loadState();
if(state.theme&&state.theme.vars)applyTheme(state.theme);
else applyTheme(THEMES.midnight);
ghLoad(); // auto-load from GitHub if configured

// On mobile, default to Tasks tab (calendar hidden until user switches)
if(window.innerWidth<=768){
  setMobileHomeTab('tasks');
}

// Use ResizeObserver to render calendar once the scroll area has real dimensions
const _calScroll=document.getElementById('cal-scroll');
if(_calScroll&&window.ResizeObserver){
  let _initialRenderDone=false;
  const _ro=new ResizeObserver(()=>{
    if(_calScroll.offsetHeight>0){
      renderAll();
      if(!_initialRenderDone){_initialRenderDone=true;_ro.disconnect();}
    }
  });
  _ro.observe(_calScroll);
}else{
  setTimeout(renderAll,80);
}

// ── CALENDAR TODO-DROP (delegated, attached once to stable #cal-scroll) ──
(()=>{
  const calScroll=document.getElementById('cal-scroll');
  if(!calScroll)return;

  function clearIndicators(){
    calScroll.querySelectorAll('.cal-drop-indicator').forEach(el=>el.remove());
  }
  function slotsDivAt(e){
    // Walk up from the element under the cursor to find .day-slots
    const el=document.elementFromPoint(e.clientX,e.clientY);
    return el?el.closest('.day-slots'):null;
  }
  function slotIdxAt(e,sd){
    const rect=sd.getBoundingClientRect();
    return Math.max(0,Math.min(TOTAL_SLOTS-1,Math.floor((e.clientY-rect.top)/slotHeight)));
  }

  calScroll.addEventListener('dragover',e=>{
    if(!todoDragState?.isTodo)return;
    e.preventDefault();
    e.dataTransfer.dropEffect='copy';
    const sd=slotsDivAt(e);
    clearIndicators();
    if(!sd)return;
    const idx=slotIdxAt(e,sd);
    let ind=document.createElement('div');
    ind.className='cal-drop-indicator';
    ind.style.top=(idx*slotHeight)+'px';
    sd.appendChild(ind);
  });

  calScroll.addEventListener('dragleave',e=>{
    if(!calScroll.contains(e.relatedTarget))clearIndicators();
  });

  calScroll.addEventListener('drop',e=>{
    clearIndicators();
    if(!todoDragState?.isTodo)return;
    e.preventDefault();
    const sd=slotsDivAt(e);
    if(!sd)return;
    const col=sd.closest('.day-col');
    const ds=col?.dataset.date;
    if(!ds)return;
    const idx=slotIdxAt(e,sd);
    const hour=8+Math.floor(idx/2);
    const startMin=(idx%2)*30;
    const task=[...state.todos.active,...state.todos.later,...state.todos.deadlines].find(t=>t.id===todoDragState.id);
    if(!task)return;
    const isDeadline=state.todos.deadlines.some(t=>t.id===task.id);
    state.calEvents.push({id:uid(),title:task.text,date:ds,hour,startMin,duration:1,
      color:isDeadline?'red':(task.color||'gold'),taskId:task.id,
      done:false,recurring:false,recurDays:[],recurExceptions:[]});
    saveState();renderCalendar();
  });
})();

// Update current time line every minute
setInterval(()=>{
  if(document.getElementById('sec-home').classList.contains('active'))renderCalendar();
},60000);

// Recalculate slot height on resize
window.addEventListener('resize',()=>{
  if(document.getElementById('sec-home').classList.contains('active'))renderCalendar();
});

// ── PANE DIVIDER DRAG ──
(()=>{
  const divider = document.getElementById('pane-divider');
  const todoPaneEl = document.getElementById('todo-pane');
  if(!divider||!todoPaneEl) return;

  // Restore saved width — apply before first render to avoid jump
  const savedW = localStorage.getItem('todoPaneWidth');
  if(savedW){ todoPaneEl.style.width = savedW + 'px'; todoPaneEl.style.flex = 'none'; }

  let dragging = false, startX = 0, startW = 0;

  divider.addEventListener('mousedown', e => {
    e.preventDefault();
    dragging = true;
    startX = e.clientX;
    startW = todoPaneEl.getBoundingClientRect().width;
    divider.classList.add('dragging');
    document.body.style.cursor = 'col-resize';
    document.body.style.userSelect = 'none';
  });

  document.addEventListener('mousemove', e => {
    if(!dragging) return;
    const delta = startX - e.clientX; // dragging left = wider todo pane
    const newW = Math.min(600, Math.max(160, startW + delta));
    todoPaneEl.style.width = newW + 'px';
    todoPaneEl.style.flex = 'none';
  });

  document.addEventListener('mouseup', () => {
    if(!dragging) return;
    dragging = false;
    divider.classList.remove('dragging');
    document.body.style.cursor = '';
    document.body.style.userSelect = '';
    localStorage.setItem('todoPaneWidth', todoPaneEl.getBoundingClientRect().width);
    renderCalendar();
  });
})();
</script>
